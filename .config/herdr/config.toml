# https://herdr.dev/docs/config-reference

onboarding = false

[update]
version_check = false
manifest_check = false

[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"
sidebar_collapsed_mode = "compact"
prompt_new_tab_name = false
sidebar_start_collapsed = true

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "workspace", "tab"],
  ["agent"],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

[ui.sound]
enabled = true

[keys]
prefix = "ctrl+s"
detach = "prefix+d"
goto = "prefix+g"
new_tab = "prefix+c"
next_tab = "prefix+n"
previous_tab = "prefix+p"
focus_pane_left = "prefix+h"
navigate_workspace_down = "j"
navigate_pane_down = "ctrl+j"
split_horizontal = "prefix+-"
split_vertical = "prefix+\\"
switch_tab = "prefix+1..9"
switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+alt+1..9"
rename_tab = "prefix+r"
rename_workspace = "prefix+shift+r"
close_tab = "prefix+x"
close_workspace = "prefix+shift+x"
reload_config = "F5"
resize_mode = "prefix+alt+r"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+q"
type = "shell"
command = "herdr server stop && sleep 1 && rm -f ~/.config/herdr/session.json ~/.config/herdr/session-history.json"
description = "quit herdr"

[experimental]
kitty_graphics = true
